<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <defs>
    <!-- Squircle macOS : le masque que Big Sur et suivants appliquent aux icônes -->
    <clipPath id="sq">
      <path d="M512 0C143 0 0 143 0 512s143 512 512 512 512-143 512-512S881 0 512 0z"/>
    </clipPath>
    <linearGradient id="fond" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#232f3e"/>
      <stop offset="1" stop-color="#121a24"/>
    </linearGradient>
    <linearGradient id="ambre" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffbd4a"/>
      <stop offset="1" stop-color="#e8912b"/>
    </linearGradient>
    <filter id="ombre" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="18" stdDeviation="22" flood-color="#000" flood-opacity=".45"/>
    </filter>
  </defs>

  <g clip-path="url(#sq)">
    <rect width="1024" height="1024" fill="url(#fond)"/>
    <!-- lueur ambrée discrète en haut à gauche -->
    <circle cx="300" cy="260" r="420" fill="#f0a83c" opacity=".07"/>
  </g>

  <!-- Feuille arrière : le document d'origine, en retrait et translucide -->
  <rect x="300" y="248" width="360" height="440" rx="52"
        fill="none" stroke="#ffffff" stroke-opacity=".28" stroke-width="34"/>

  <!-- Feuille avant : la copie, pleine et ambrée -->
  <rect x="404" y="352" width="360" height="440" rx="52" fill="url(#ambre)" filter="url(#ombre)"/>

  <!-- Trois lignes de texte sur la copie -->
  <g stroke="#1b2531" stroke-width="30" stroke-linecap="round" opacity=".85">
    <line x1="484" y1="470" x2="684" y2="470"/>
    <line x1="484" y1="560" x2="684" y2="560"/>
    <line x1="484" y1="650" x2="604" y2="650"/>
  </g>
</svg>
